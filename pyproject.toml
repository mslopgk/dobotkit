[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dobotkit"
dynamic = ["version"]
description = "Complete pure-Python control library for Dobot Magician Lite (arm) and Magician GO (car)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "dobotkit contributors" }]
dependencies = ["pyserial>=3.5", "websockets>=11.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy"]

[tool.hatch.version]
path = "src/dobotkit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dobotkit"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
# Runtime support stays >=3.9 (see requires-python); this is the lowest version
# the installed mypy can type-check against. 3.9-vs-3.10 makes no difference to
# this codebase's annotations.
python_version = "3.10"
packages = ["dobotkit"]
strict = true

# pyserial ships no type stubs (and types-pyserial may be unavailable offline);
# ignore its missing imports rather than weakening the strict gate elsewhere.
[[tool.mypy.overrides]]
module = ["serial", "serial.*"]
ignore_missing_imports = true

# The GUI layer is Tkinter view code: widget subclasses forward **kwargs to
# stdlib ttk widgets and event handlers take loosely-typed Tk events, so full
# strict typing adds noise without catching real bugs. Relax the untyped/any
# gates here (the controller/logic layer stays under the strict gate above).
[[tool.mypy.overrides]]
module = ["dobotkit.gui.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
