[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dobotkit"
dynamic = ["version"]
description = "Complete pure-Python control library for Dobot Magician Lite (arm) and Magician GO (car) over DobotLink"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "dobotkit contributors" }]
keywords = ["dobot", "magician-lite", "magician-go", "magicbox", "robotics", "robot-arm", "dobotlink", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["websockets>=11.0"]

[project.urls]
Homepage = "https://github.com/mslopgk/dobotkit"
Repository = "https://github.com/mslopgk/dobotkit"
Issues = "https://github.com/mslopgk/dobotkit/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy"]
publish = ["build", "twine"]

[tool.hatch.version]
path = "src/dobotkit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dobotkit"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# Put the src/ layout first on sys.path so `pytest` resolves the real package
# even when run from the repo root (an unrelated nested `dobotkit/` dir would
# otherwise shadow it as a namespace package).
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
# Runtime support stays >=3.9 (see requires-python); this is the lowest version
# the installed mypy can type-check against. 3.9-vs-3.10 makes no difference to
# this codebase's annotations.
python_version = "3.10"
packages = ["dobotkit"]
strict = true
